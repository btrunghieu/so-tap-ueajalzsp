<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tập V-taper 4.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#EEF2EC;--surface:#F9FBF7;--ink:#1C2B25;--muted:#56665E;--line:#C6D1C4;--soft:#DCE4D9;
  --pine:#2F5D4E;--on-pine:#F3F8F4;--marker:#F4CD3C;--on-marker:#2A2204;--brick:#A63F2B;
  --ridge:#D5E2D1;--focus:#1D63D8;
  --f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --n:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121C18;--surface:#192620;--ink:#E3ECE6;--muted:#9AADA3;--line:#30433B;--soft:#22332C;--pine:#74BA9D;--on-pine:#0E1914;--marker:#E9C23A;--on-marker:#1F1902;--brick:#E8866F;--ridge:#1D2F28;--focus:#86B7FF;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121C18;--surface:#192620;--ink:#E3ECE6;--muted:#9AADA3;--line:#30433B;--soft:#22332C;--pine:#74BA9D;--on-pine:#0E1914;--marker:#E9C23A;--on-marker:#1F1902;--brick:#E8866F;--ridge:#1D2F28;--focus:#86B7FF;color-scheme:dark}
:root[data-theme="strava"]{--paper:#121212;--surface:#1E1E1E;--ink:#F5F5F5;--muted:#A3A3A3;--line:#343434;--soft:#262626;--pine:#FC4C02;--on-pine:#FFFFFF;--marker:#FFFFFF;--on-marker:#121212;--brick:#FF5A6E;--ridge:#2A2A2A;--focus:#5AA9FF;color-scheme:dark}
:root[data-theme="strava"] nav.tabs{background:#121212;border-top-color:#2A2A2A}
:root[data-theme="strava"] nav.tabs button[aria-current="page"]{color:#FC4C02}
:root[data-theme="strava"] nav.tabs button[aria-current="page"]::before{background:#FC4C02}
:root[data-theme="strava"] .btn.pri,:root[data-theme="strava"] .q button[aria-pressed="true"]{font-weight:700}
:root[data-theme="strava"] .nutline,:root[data-theme="strava"] .how,:root[data-theme="strava"] .banner{background:#1E1E1E}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header + ridge */
.top{padding-top:10px}
.toprow{display:flex;align-items:center;gap:8px}
.wk{flex:1;min-width:0;text-align:center}
.wk b{display:block;font:700 1.4rem/1.1 var(--n);letter-spacing:.2px}
.wk .sub{font-size:.8rem;color:var(--muted)}
#savestat::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pine);margin:0 4px 1px 8px}
#savestat.busy::before{background:var(--marker)}
#savestat.warn{color:var(--brick)}
#savestat.warn::before{background:var(--brick)}
.linkbtn{border:0;background:none;color:var(--pine);font-size:.8rem;text-decoration:underline;text-underline-offset:2px;padding:0 0 0 8px}
.iconbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.15rem;line-height:1;padding:0}
.ridge{position:relative;height:120px;margin:4px -8px 0}
.ridge svg{position:absolute;left:0;top:0;width:100%;height:84px}
.r-area{fill:var(--ridge)}
.r-c{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.r-main{fill:none;stroke:var(--pine);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.days{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
.days button{position:relative;background:none;border:0;border-radius:10px;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;padding:0 0 4px}
.days button b{font:600 .75rem/1 var(--f)}
.days button span{font:600 1.1rem/1.1 var(--n)}
.days button[aria-current="date"]{color:var(--ink)}
.days button[aria-current="date"] b{font-weight:700}
.days button.today span{text-decoration:underline 2px;text-underline-offset:3px}
.dot{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface);border:2px solid var(--pine)}
.rest .dot{width:10px;height:10px;margin-left:-5px;border-color:var(--muted)}
.done .dot{background:var(--pine)}
[aria-current="date"] .dot{box-shadow:0 0 0 5px var(--marker)}

/* page */
#view{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
body.timing #view{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.loading{padding:48px 0;color:var(--muted)}
h1.dayh{font:700 2.2rem/1.05 var(--n);margin:18px 0 6px;letter-spacing:.2px}
.tag{font:600 .75rem/1 var(--f);background:var(--marker);color:var(--on-marker);padding:4px 7px;border-radius:4px;vertical-align:.45em;margin-left:8px}
.focusline{margin:0}
.code{display:inline-block;font:600 .78rem/1.7 var(--f);border:1px solid var(--pine);color:var(--pine);border-radius:4px;padding:0 6px;margin-right:8px;vertical-align:1px}
.muted{color:var(--muted)}
.nutline{display:block;width:100%;text-align:left;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;line-height:1.35}
.nutline strong{font:700 1.3rem/1 var(--n)}
.mac{font:600 1.02rem/1 var(--n);word-spacing:.35em;margin-left:4px}
.blk{margin-top:24px}
h2{font:600 1.02rem/1.3 var(--f);margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--muted);font-size:.82rem}
h2 .btn{margin-left:auto}
.note{font-size:.84rem;color:var(--muted);margin:6px 0 0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.chk input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--pine)}
.chk.on span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
ul.steps{margin:0;padding-left:18px}
ul.steps li{margin:2px 0}
.banner{margin:12px 0 0;padding:10px 12px;border-left:4px solid var(--marker);background:var(--surface);border-radius:0 6px 6px 0}
.banner.ok{border-left-color:var(--pine)}
.banner.warn{border-left-color:var(--brick)}

/* exercises */
.ex{position:relative;padding:14px 0 14px 42px;border-bottom:1px solid var(--soft)}
.ex .no{position:absolute;left:0;top:12px;width:32px;text-align:center;font:700 1.75rem/1 var(--n);color:var(--muted)}
.ex.done .no{color:var(--pine)}
.ex h3{font:600 1rem/1.3 var(--f);margin:0}
.rx{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:3px;font:600 1.05rem/1.3 var(--n)}
.cue{font-size:.84rem;color:var(--muted);margin:4px 0 0}
.prev{font-size:.86rem;margin:8px 0 0}
.prev b{font:700 1.05rem/1 var(--n)}
.hint{display:inline-block;font:500 .78rem/1.35 var(--f);padding:2px 7px;border-radius:4px;margin:2px 0 0 2px}
.hint.up{background:var(--marker);color:var(--on-marker)}
.hint.down{color:var(--brick);border:1px solid var(--brick)}
.hint.hold{color:var(--muted);border:1px solid var(--line)}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.set label{display:block;font-size:.7rem;color:var(--muted);text-align:center;margin-bottom:2px}
.rep{width:3.2em;height:50px;font:700 1.6rem/1 var(--n);text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0}
.rep.hit{border-color:var(--pine);box-shadow:inset 0 -3px 0 var(--pine)}
.rep.load{width:3.8em;font-size:1.3rem}
.exv{margin-top:8px;width:100%}
.st{font-size:.84rem;margin:6px 0 0}
.st:empty{display:none}

/* cách tập */
.exhead{display:inline-block;max-width:100%;position:relative;vertical-align:top}
.exname{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.info{width:24px;height:24px;margin-left:8px;border:1px solid var(--pine);border-radius:50%;background:var(--surface);color:var(--pine);font:italic 700 .82rem/1 Georgia,"Times New Roman",serif;padding:0;vertical-align:2px}
.info[aria-expanded="true"]{background:var(--pine);color:var(--on-pine)}
.how{display:none;margin:8px 0 4px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pine);border-radius:0 8px 8px 0;font-size:.88rem;line-height:1.5;text-align:left}
.how.open{display:block}
.how p{margin:0 0 6px}
.how ol,.how ul{margin:0 0 8px;padding-left:20px}
.how li{margin:2px 0}
.how .howh{font-weight:600;margin:8px 0 2px}
.how .howsafe{color:var(--brick)}
@media (hover:hover) and (pointer:fine){
  .exname{text-decoration:underline dotted var(--muted);text-underline-offset:4px;cursor:help}
  .exhead:not(.nohov):hover .how:not(.open){display:block;position:absolute;left:0;top:calc(100% - 2px);width:min(540px,calc(100vw - 80px));z-index:6;margin:0;box-shadow:0 10px 28px rgba(0,0,0,.2)}
}
/* widget calo */
.ring .rg-bg{fill:none;stroke:var(--soft)}
.ring .rg-fg{fill:none;stroke:var(--pine);stroke-linecap:round}
.ring.over .rg-fg{stroke:var(--brick)}
.ring.full .rg-fg{stroke:var(--pine)}
.kw{margin-top:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kw-main{display:flex;align-items:center;gap:18px}
.kw-ring{position:relative;width:148px;height:148px;flex:none}
.kw-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.kw-center b{font:700 2.5rem/1 var(--n)}
.kw-center b.over{color:var(--brick)}
.kw-center span{font-size:.74rem;color:var(--muted);margin-top:3px}
.kw-side{flex:1;min-width:0;display:grid;gap:9px}
.kw-eq{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--soft);padding-bottom:5px}
.kw-eq span{font-size:.8rem;color:var(--muted)}
.kw-eq b{font:700 1.35rem/1 var(--n)}
.kw-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.km{display:flex;flex-direction:column;align-items:center;text-align:center}
.km-ring{position:relative;width:62px;height:62px}
.km-ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 1.1rem/1 var(--n)}
.km>span{font-size:.8rem;font-weight:600;margin-top:5px}
.km small{font-size:.72rem;color:var(--muted)}
.km small.over{color:var(--brick)}
.km small.okc{color:var(--pine)}
.kw-mini{display:flex;align-items:center;gap:12px}
.kw-mini .ring{flex:none}
.kw-mini .kt{min-width:0}
.kw-mini .kt b{font:700 1.6rem/1 var(--n)}
.kw-mini .kt b.over{color:var(--brick)}
.kw-mini .kt small{display:block;margin-top:3px}
/* thói quen */
.habit{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.habit input{flex:none;width:24px;height:24px;margin:0;accent-color:var(--pine)}
.habit .hn{flex:1;min-width:0}
.habit .ht{font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 8px;white-space:nowrap}
.habit .hs{font:600 .95rem/1 var(--n);color:var(--muted);min-width:3.2em;text-align:right}
.habit.on .hn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.habit.on .hs{color:var(--pine)}
.hrow{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}
/* inputs */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px}
.fld>span{font-size:.74rem;color:var(--muted)}
.fld.grow{flex:1 1 170px}
.in{height:42px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;min-width:0}
.numin{width:5.4em;font:600 1.2rem/1 var(--n)}
.numin.s{width:4.4em}
.ta{width:100%;height:auto;padding:8px 10px;resize:vertical;line-height:1.45}
.btn{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:500 .9rem/1 var(--f)}
.btn.pri{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.btn.sm{height:32px;padding:0 10px;font-size:.8rem}
.chip{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:17px;background:var(--surface);font:500 .82rem/1 var(--f)}
.chip small{color:var(--muted);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center}
.x{flex:none;min-width:34px;height:34px;border:0;border-radius:17px;background:none;color:var(--muted);font-size:1.25rem;line-height:1;padding:0}
.x.armed{color:var(--on-pine);background:var(--brick);font-size:.75rem;padding:0 10px}

/* food, sleep, body */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:2.6em 1fr 6.6em;align-items:center;gap:10px}
.bar>span{font-weight:600}
.tr{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--pine)}
.tr i.over{background:var(--brick)}
.bar b{font:700 1.15rem/1 var(--n);text-align:right}
.bar b small{font-weight:500;color:var(--muted);font-size:.85rem}
.list{border-top:1px solid var(--soft)}
.li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--soft)}
.li .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.li .mc{font:500 .98rem/1.2 var(--n);color:var(--muted);text-align:right}
.big{font:700 2.4rem/1 var(--n);margin:4px 0 0}
.warnc{color:var(--brick)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px 16px}
.kv span{display:block;font-size:.76rem;color:var(--muted)}
.kv b{font:700 1.5rem/1.15 var(--n)}
.q{display:flex;gap:8px;margin-top:4px}
.q button{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--surface);font:700 1.25rem/1 var(--n)}
.q button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.lbl{font-size:.74rem;color:var(--muted);margin:14px 0 0}
.chart{display:block;width:100%;height:auto;margin-top:8px}
.chart text{font:11px var(--f);fill:var(--muted)}
.chart .gl{stroke:var(--soft);stroke-width:1}
.chart .ref{stroke:var(--marker);stroke-width:1.5;stroke-dasharray:5 4}
.chart polyline.main{fill:none;stroke:var(--pine);stroke-width:2.5;stroke-linejoin:round}
.chart circle.main{fill:var(--pine)}
.chart circle.raw{fill:var(--muted);opacity:.55}
.chart .okb{fill:var(--pine)}
.chart .low{fill:var(--brick)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:600;color:var(--muted);font-size:.76rem}
.tbl td{font:600 1rem/1.2 var(--n)}
.flag{color:var(--brick);font-weight:700}
details{margin-top:12px}
summary{cursor:pointer;font-weight:600;padding:6px 0}
.ibform{margin:6px 0 14px;padding:12px;border:1px dashed var(--line);border-radius:8px}

/* tabs, timer, sheet, toast */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
nav.tabs button{position:relative;height:58px;border:0;background:none;color:var(--muted);font:500 .86rem/1 var(--f)}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;left:24%;right:24%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--marker)}
.timer{position:fixed;left:0;right:0;z-index:19;bottom:calc(59px + env(safe-area-inset-bottom,0px));background:var(--pine);color:var(--on-pine);display:none}
body.timing .timer{display:block}
.timer.go{background:var(--marker);color:var(--on-marker)}
.timer .wrap{display:flex;align-items:center;gap:8px;height:58px}
.timer .t{font:700 2.1rem/1 var(--n);min-width:2.8em}
.timer .tl{flex:1;min-width:0;height:auto;border:0;background:none;color:inherit;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px;font:inherit}
.timer .tl b{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tl span{font-size:.76rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep.next{border-color:var(--marker);box-shadow:0 0 0 3px var(--marker)}
.timer button{flex:none;height:38px;min-width:44px;padding:0 8px;border:1px solid currentColor;border-radius:6px;background:transparent;color:inherit;font:700 .95rem/1 var(--n)}
.sheet{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.pane{position:relative;isolation:isolate;box-shadow:0 -8px 30px rgba(0,0,0,.5);width:100%;max-width:640px;max-height:90%;overflow:auto;background:var(--paper);border-radius:14px 14px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.pane h2{margin-top:20px}
.sheethead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-16px;z-index:2;background:var(--paper);margin:-16px -16px 0;padding:16px;border-bottom:1px solid var(--line)}
.sheethead h2{margin:0;font:700 1.5rem/1 var(--n)}
.filebtn{display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:50;max-width:90vw;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:.86rem;display:none}
.toast.show{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (min-width:700px){body{font-size:16px}}
</style>
</head>
<body>
<header class="top wrap">
  <div class="toprow">
    <button class="iconbtn" id="prevw" aria-label="Tuần trước">‹</button>
    <div class="wk"><b id="wk-title">Sổ tập</b><span class="sub"><span id="wk-range"></span><span id="savestat" role="status"></span><button class="linkbtn" id="todaybtn" hidden>về hôm nay</button></span></div>
    <button class="iconbtn" id="nextw" aria-label="Tuần sau">›</button>
    <button class="iconbtn" id="setbtn" aria-label="Cài đặt và dữ liệu">⚙</button>
  </div>
  <div class="ridge"><svg id="ridge-svg" viewBox="0 0 700 84" preserveAspectRatio="none" aria-hidden="true"></svg><div class="days" id="ridge-days"></div></div>

function smooth(pts) {

  }

}

}

  h += habBlock(k);
  h += walkBlock(k, d);
  h += metricsBlock(k, d);
  h += checklist('Buổi sáng', 'm', MORNING, d);

  if (P.ex) {

    h += `<section class="blk"><h2>Calisthenics <small>đúng thứ tự</small></h2>${P.ex.map((e, i) => exBlock(k, e, i)).join('')}`;

}

/* ---------- charts ---------- */
function lineChart(o) {
  const W = 600, H = o.h || 180, L = 42, R = 10, T = 12, B = 24;
  const all = o.series.reduce((a, s) => a.concat(s.pts), []);
  if (!all.length) return '<p class="note">Chưa có dữ liệu.</p>';
  const x0 = o.x0, x1 = o.x1 === o.x0 ? o.x0 + 1 : o.x1;
  let y0 = Math.min.apply(null, all.map(p => p[1])), y1 = Math.max.apply(null, all.map(p => p[1]));
  const padY = Math.max((y1 - y0) * 0.15, o.minPad || 0.4); y0 -= padY; y1 += padY;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, yy = Y(v).toFixed(1); g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${(+yy + 4).toFixed(1)}" text-anchor="end">${f1(v)}</text>`; }
  g += `<text x="${L}" y="${H - 6}">${esc(o.xFmt(x0))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(o.xFmt(x1))}</text>`;
  o.series.forEach(s => {
    const pts = s.pts.slice().sort((a, b) => a[0] - b[0]);
    if (s.line && pts.length > 1) g += `<polyline class="${s.cls}" points="${pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}"/>`;
    if (s.dots) g += pts.map(p => `<circle class="${s.cls}" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${s.r || 3}"/>`).join('');
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}</svg>`;
}
function sleepChart(endK) {
  const W = 600, H = 150, L = 30, R = 8, T = 8, B = 22, n = 14, bw = (W - L - R) / n;
  const vals = []; for (let i = n - 1; i >= 0; i--) { const k = addDays(endK, -i); vals.push({ k, m: sleepMin((D(k) || {}).sleep) }); }
  const max = Math.max(600, ...vals.map(v => v.m || 0));
  const Y = m => T + (1 - m / max) * (H - T - B);
  let s = '';
  [360, 420, 480].forEach(m => { s += `<line class="${m === 420 ? 'ref' : 'gl'}" x1="${L}" x2="${W - R}" y1="${Y(m).toFixed(1)}" y2="${Y(m).toFixed(1)}"/><text x="${L - 4}" y="${(Y(m) + 4).toFixed(1)}" text-anchor="end">${m / 60}h</text>`; });
  vals.forEach((v, i) => {
    const x = L + i * bw + 3;
    if (v.m) s += `<rect class="${v.m < 420 ? 'low' : 'okb'}" x="${x.toFixed(1)}" y="${Y(v.m).toFixed(1)}" width="${(bw - 6).toFixed(1)}" height="${(H - B - Y(v.m)).toFixed(1)}" rx="2"/>`;
    if (i % 2 === 1) s += `<text x="${(x + (bw - 6) / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${dm(v.k)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Thời lượng ngủ 14 đêm gần nhất">${s}</svg>`;
}

/* ---------- rest timer (biết mình đang ở đâu trong buổi) ---------- */
const TM = { end: 0, iv: null, ctx: null, target: null, goText: '', cueT: null };
let lastLogAt = 0, batchNoted = false;
function audioInit() {
  if (!state.settings.sound) return;
  try { if (!TM.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) TM.ctx = new AC(); } if (TM.ctx && TM.ctx.state === 'suspended') TM.ctx.resume(); } catch (e) {}
}
function beep() {
  const c = TM.ctx; if (!c) return;
  try {
    const t = c.currentTime;
    [0, 0.3].forEach(off => {
      const o = c.createOscillator(), g = c.createGain();

    });
  } catch (e) {}
}
function markNext() {
  $$('.rep.next').forEach(x => x.classList.remove('next'));

}
function setBar(head, sub, target) {

}
function startTimer(sec, head, sub, target, goText) {

}
function showCue(head, sub, target) {
  clearInterval(TM.iv); TM.iv = null; clearTimeout(TM.cueT);
  $('#tm-time').textContent = '→';
  setBar(head, sub, target);
  $('#timer').classList.add('go');
  document.body.classList.add('timing');
  TM.cueT = setTimeout(() => { if (!TM.iv) hideBar(); }, 7000);
}
function tick() {
  const left = Math.max(0, Math.ceil((TM.end - Date.now()) / 1000));
  $('#tm-time').textContent = mmss(left);
  if (left > 0) return;
  clearInterval(TM.iv); TM.iv = null;
  $('#timer').classList.add('go'); $('#tm-head').textContent = TM.goText;
  if (state.settings.sound) { beep(); try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) {} }
  TM.cueT = setTimeout(() => { if (!TM.iv) hideBar(); }, 8000);
}
function hideBar() { clearInterval(TM.iv); TM.iv = null; clearTimeout(TM.cueT); document.body.classList.remove('timing'); $('#timer').classList.remove('go'); }
function stopTimer() { hideBar(); TM.target = null; markNext(); }
function exDef(id) { return (dayPlan(ui.date).ex || []).find(e => e.id === id); }
function nextInfo(ex, set, k) {
  const n = setsFor(ex, k), pv = prevLog(ex.id, k), pr = pv ? num(pv.r[set]) : null;
  return { id: `r-${ex.id}-${set}`, what: `hiệp ${set + 1}/${n} ${ex.n}`, goal: `Mục tiêu ${ex.lo}–${ex.hi}${pr != null ? ` (lần trước ${pr})` : ''}` };
}
function nextStep(list, idx, j, k) {
  const e = list[idx], n = setsFor(e, k), tag = e.tag || '';
  const isA = /^\d+a$/.test(tag), isB = /^\d+b$/.test(tag);
  if (isA && list[idx + 1]) { const b = list[idx + 1], x = nextInfo(b, j, k); return { rest: 0, head: `Sang ngay ${b.tag}: ${b.n}`, sub: `Hiệp ${j + 1}. ${x.goal}`, x }; }
  if (isB && list[idx - 1] && j < n - 1) { const a = list[idx - 1], x = nextInfo(a, j + 1, k); return { rest: e.rest || 60, head: `Nghỉ rồi lặp ${a.tag}`, sub: `Tiếp: ${x.what}. ${x.goal}`, x }; }
  if (!isB && j < n - 1) {
    const x = nextInfo(e, j + 1, k);
    if (!e.rest) return { rest: 0, head: 'Làm tiếp, không nghỉ riêng', sub: `${e.rl ? e.rl + '. ' : ''}Tiếp: hiệp ${j + 2}/${n}. ${x.goal}`, x };
    return { rest: e.rest, head: 'Nghỉ giữa hiệp', sub: `Tiếp: hiệp ${j + 2}/${n}. ${x.goal}`, x };
  }
  const nx = list[idx + 1];
  if (!nx) return null;
  const x = nextInfo(nx, 0, k);
  return { rest: Math.min(150, Math.max(60, nx.rest || 60)), head: `Chuyển bài: ${nx.tag || idx + 2}. ${nx.n}`, sub: `Hiệp 1/${setsFor(nx, k)}. ${x.goal}`, x };
}
function smartRest(id, j) {
  const k = ui.date, list = dayPlan(k).ex || [], idx = list.findIndex(e => e.id === id);
  if (idx < 0) return;
  const e = list[idx], n = setsFor(e, k), reps = ((((D(k) || {}).sets) || {})[id] || {}).r || [];
  for (let i = 0; i < j; i++) if (num(reps[i]) == null) return;       // ghi lệch thứ tự → không bấm giờ
  for (let i = j + 1; i < n; i++) if (num(reps[i]) != null) return;   // sửa hiệp cũ → không bấm giờ
  const now = Date.now(), gap = now - lastLogAt; lastLogAt = now;
  if (gap < 20000) {                                                  // ghi bù nhiều hiệp liền nhau
    stopTimer();
    if (!batchNoted) { toast('Đang ghi bù nhiều hiệp liền — tạm tắt đồng hồ nghỉ.'); batchNoted = true; }
    return;
  }
  batchNoted = false;
  const st = nextStep(list, idx, j, k);
  if (!st) { stopTimer(); toast('Xong phần calisthenics hôm nay.'); return; }
  if (st.rest <= 0) { showCue(st.head, st.sub, st.x.id); return; }

}

  $('#tm-go').addEventListener('click', () => { const el = TM.target && document.getElementById(TM.target); if (!el) return; if (el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.focus({ preventScroll: true }); });

  view.addEventListener('focusin', e => { const t = e.target; if (t.classList && t.classList.contains('rep')) t.dataset.before = t.value; });
  view.addEventListener('input', e => {
    const t = e.target, k = ui.date, ds = t.dataset;
    if (ds.ex && ds.j != null) {
      const d = dayW(k); d.sets = d.sets || {}; const x = d.sets[ds.ex] = d.sets[ds.ex] || {}; x.r = x.r || [];
      x.r[+ds.j] = num(t.value); touch(k); refreshEx(ds.ex); markNext();

      if (t.value !== '') repPend[t.id] = setTimeout(() => { commitRep(t); if (document.activeElement === t) t.blur(); }, 1200);
      return;
    }
    if (ds.exw) { const d = dayW(k); d.sets = d.sets || {}; const x = d.sets[ds.exw] = d.sets[ds.exw] || {}; const v = num(t.value); if (v == null) delete x.w; else x.w = v; touch(k); return; }
    if (ds.exv) { const d = dayW(k); d.sets = d.sets || {}; const x = d.sets[ds.exv] = d.sets[ds.exv] || {}; const v = t.value.trim(); if (v) x.v = v; else delete x.v; touch(k, 1000); return; }
    if (ds.metric) { const d = dayW(k), v = num(t.value); if (v == null) delete d[ds.metric]; else d[ds.metric] = v; touch(k); if (ds.metric === 'steps') refreshWalk(); return; }
    if (ds.ride) { const d = dayW(k); d.ride = d.ride || {}; const v = num(t.value); if (v == null) delete d.ride[ds.ride]; else d.ride[ds.ride] = v; touch(k); refreshRide(); return; }
    if (t.hasAttribute('data-daynote')) { const d = dayW(k); if (t.value.trim()) d.note = t.value; else delete d.note; touch(k, 1200); return; }
    if (ds.sleep) { const d = dayW(k); d.sleep = d.sleep || {}; if (t.value) d.sleep[ds.sleep] = t.value; else delete d.sleep[ds.sleep]; touch(k); const el = $('#sl-dur'); if (el) el.textContent = hm(sleepMin(d.sleep)); return; }
  });
  view.addEventListener('change', e => {
    const t = e.target, k = ui.date, ds = t.dataset;
    if (ds.ex && ds.j != null) { commitRep(t); return; }
    if (ds.hab) {
      const d = dayW(k); d.hab = d.hab || {}; if (t.checked) d.hab[ds.hab] = true; else delete d.hab[ds.hab];
      t.closest('.habit').classList.toggle('on', t.checked); touch(k);
      const h = habits().find(x => x.id === ds.hab), sEl = h && $(`[data-hs="${ds.hab}"]`); if (sEl) { const n = habStreak(h, k); sEl.textContent = n ? n + ' ngày' : ''; }
      const list = habits().filter(x => habActive(x, k)), c = $('#hab-count'); if (c) c.textContent = `${list.filter(x => habOn(k, x.id)).length}/${list.length}`;
      return;
    }
    if (ds.chk) { const d = dayW(k); d.chk = d.chk || {}; if (t.checked) d.chk[ds.chk] = true; else delete d.chk[ds.chk]; t.closest('.chk').classList.toggle('on', t.checked); touch(k); return; }
    if (t.hasAttribute('data-photo')) { const d = dayW(k); if (t.checked) d.photo = true; else delete d.photo; t.closest('.chk').classList.toggle('on', t.checked); touch(k); return; }
    if (t.hasAttribute('data-ride-done')) { const d = dayW(k); d.ride = d.ride || {}; if (t.checked) d.ride.done = true; else delete d.ride.done; t.closest('.chk').classList.toggle('on', t.checked); touch(k); refreshRide(); return; }
  });
  view.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !ui.ready) return;
    const k = ui.date, ds = b.dataset;
    if (ds.how) { toggleHow(ds.how); return; }
    if (b.hasAttribute('data-habedit')) { openSheet(); const el = $('#hab-set'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' }); return; }
    if (ds.go) { goTab(ds.go); return; }
    if (ds.timer) { startTimer(+ds.timer, 'Nghỉ: ' + (ds.label || ''), 'Bấm giờ thủ công'); return; }
    if (ds.addfood) { addFood(ds.addfood === '2'); return; }
    if (ds.delfood) { const d = dayW(k); d.food = (d.food || []).filter(x => String(x.id) !== ds.delfood); touch(k); render(); return; }
    if (ds.preset != null) { const p = state.presets[+ds.preset]; if (!p) return; const d = dayW(k); d.food = d.food || []; d.food.push({ id: uid(), n: p.n, kcal: p.kcal, p: p.p, c: p.c, f: p.f }); touch(k); render(); toast('Đã thêm ' + p.n); return; }
    if (b.hasAttribute('data-editpresets')) { ui.editPresets = !ui.editPresets; render(); return; }
    if (ds.delpreset != null) { if (!armed(b)) return; state.presets.splice(+ds.delpreset, 1); queue('presets'); render(); return; }
    if (ds.sq) { const d = dayW(k); d.sleep = d.sleep || {}; const q = +ds.sq; if (d.sleep.q === q) delete d.sleep.q; else d.sleep.q = q; touch(k); $$('.q button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.sq === d.sleep.q))); return; }
    if (b.hasAttribute('data-ibform')) { ui.ibForm = !ui.ibForm; render(); const f = $('#ib-weight'); if (ui.ibForm && f) f.focus(); return; }
    if (b.hasAttribute('data-ibsave')) { saveInbody(); return; }
    if (ds.delib) { if (!armed(b)) return; state.inbody = state.inbody.filter(x => x.id !== ds.delib); queue('inbody'); render(); return; }
  });

  const sh = $('#sheet');
  sh.addEventListener('click', e => {
    if (e.target === sh) { closeSheet(); return; }
    const b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-close')) { closeSheet(); return; }
    if (b.hasAttribute('data-export')) { doExport(); return; }
    if (b.hasAttribute('data-syncsave')) { const v = ($('#sync-token') || {}).value || ''; if (!v.trim()) { ioMsg('Dán token trước đã.'); return; } try { localStorage.setItem(SY.TK, v.trim()); } catch (e) {} SY.sha = null; ioMsg('Đang kết nối…'); syncPull(true).then(ok => { if (ok) syncPush(); }); return; }
    if (b.hasAttribute('data-syncnow')) { ioMsg('Đang đồng bộ…'); syncPull(true).then(ok => { if (ok) syncPush(); }); return; }
    if (b.hasAttribute('data-syncoff')) { try { localStorage.removeItem(SY.TK); } catch (e) {} ioMsg('Đã ngắt đồng bộ trên máy này.'); const i = $('#sync-info'); if (i) i.textContent = syncInfo(); return; }
    if (b.hasAttribute('data-habadd')) {
      const list = habits().slice(); list.push({ id: 'h' + uid(), n: '', t: '', from: todayKey(), to: null });
      SET().habits = list; queue('settings'); $('#hab-list').innerHTML = habRows();
      const ins = $$('#hab-list input[data-habf="n"]'); if (ins.length) ins[ins.length - 1].focus();
      render(); return;
    }
    if (b.dataset.habdel) { if (!armed(b)) return; SET().habits = habits().filter(h => h.id !== b.dataset.habdel); queue('settings'); $('#hab-list').innerHTML = habRows(); render(); return; }
    if (b.hasAttribute('data-importtext')) { const ta = $('#imp-text'); if (ta && ta.value.trim()) doImport(ta.value); else ioMsg('Dán nội dung JSON vào ô trước.'); }
  });
  sh.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.habf) {
      const list = habits().map(h => Object.assign({}, h)), h = list.find(x => x.id === t.dataset.hid); if (!h) return;
      const f = t.dataset.habf; let v = t.value;
      if (t.type === 'date') v = isKey(v) ? v : null; else v = String(v).trim();
      h[f] = v; SET().habits = list; queue('settings'); render(); return;
    }
    if (t.dataset.set) {
      const key = t.dataset.set;
      let v = t.type === 'checkbox' ? t.checked : t.value;
      if (key === 'ffm' || key === 'deloadWeek') v = num(v);
      if (t.type === 'date') v = isKey(v) ? v : null;
      if (key === 'pauseLabel') v = String(v).trim();
      state.settings[key] = v; queue('settings');
      if (key === 'theme') applyTheme();
      const fn = $('#floor-note'); if (fn) fn.textContent = floorNote();
      render(); return;
    }
    if (t.hasAttribute('data-import') && t.files && t.files[0]) {
      const fr = new FileReader();
      fr.onload = () => doImport(String(fr.result));
      fr.onerror = () => ioMsg('Không đọc được file.');
      fr.readAsText(t.files[0]); t.value = '';
    }
  });
  document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if ($('#sheet').classList.contains('open')) { closeSheet(); return; } const h = document.activeElement && document.activeElement.closest && document.activeElement.closest('.exhead'); if (h) { h.classList.add('nohov'); h.addEventListener('mouseleave', () => h.classList.remove('nohov'), { once: true }); } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { flushAll(); return; }
    const tk = todayKey();
    if (ui.lastToday !== tk) { if (ui.date === ui.lastToday) ui.date = tk; ui.lastToday = tk; if (ui.ready && !isTyping()) render(); }
    refreshFromDb();
  });
  window.addEventListener('pagehide', flushAll);
}


/* ---------- sync: GitHub private repo (token only in this device's localStorage) ---------- */
const SY = { TK: 'vtsync:token', REPO: 'btrunghieu/so-tap-data', FILE: 'data.json', sha: null, t: null, busy: false, again: false, applying: false, last: null, err: '' };
function syTok() { try { return localStorage.getItem(SY.TK) || ''; } catch (e) { return ''; } }
function syncInfo() { if (!syTok()) return 'Chưa kết nối. Dán token GitHub (chỉ quyền Contents của repo so-tap-data) để tự sao lưu mọi thay đổi.'; return 'Đã kết nối ' + SY.REPO + '. ' + (SY.err ? 'Lỗi: ' + SY.err : SY.last ? 'Đồng bộ lần cuối ' + new Date(SY.last).toLocaleString('vi-VN') : 'Chưa đồng bộ lần nào.'); }
function syUpd() { const i = $('#sync-info'); if (i) i.textContent = syncInfo(); }
function syApi(method, body) { return fetch('https://api.github.com/repos/' + SY.REPO + '/contents/' + SY.FILE, { method, cache: 'no-store', headers: { Authorization: 'Bearer ' + syTok(), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, body: body ? JSON.stringify(body) : undefined }); }
const b64e = s => { const b = new TextEncoder().encode(s); let r = ''; for (let i = 0; i < b.length; i += 0x8000) r += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(r); };
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
function mergeHabits(o) {
  const rh = o && o.settings && Array.isArray(o.settings.habits) ? o.settings.habits.filter(x => x && x.id) : [];
  if (!rh.length) return 0;
  const loc = Array.isArray(state.settings.habits) ? state.settings.habits.filter(x => x && x.id).map(x => Object.assign({}, x)) : [];
  let n = 0;
  rh.forEach(r => { const i = loc.findIndex(x => x.id === r.id); if (i < 0) { loc.push(Object.assign({}, r)); n++; } else if (JSON.stringify(loc[i]) !== JSON.stringify(Object.assign({}, loc[i], r))) { loc[i] = Object.assign({}, loc[i], r); n++; } });
  if (n) { state.settings.habits = loc; if (S.mode === 'local') lsSet('settings', state.settings); }
  return n;
}
function syncSoon() { if (!syTok()) return; clearTimeout(SY.t); SY.t = setTimeout(syncPush, 2500); }
function exportObj() { return { app: 'so-tap-vtaper', v: 1, exportedAt: new Date().toISOString(), settings: state.settings, inbody: state.inbody, presets: state.presets, days: state.days }; }
async function syncPush() {
  if (!syTok()) return; if (SY.busy) { SY.again = true; return; } SY.busy = true;
  try {
    for (let tries = 0; tries < 2; tries++) {
      if (!SY.sha) { const g = await syApi('GET'); if (g.ok) { const gj = await g.json(); SY.sha = gj.sha; try { SY.applying = true; if (mergeHabits(JSON.parse(b64d(gj.content)))) render(); } catch (e) {} SY.applying = false; } else if (g.status !== 404) throw new Error('HTTP ' + g.status); }
      const body = { message: 'sync ' + new Date().toISOString(), content: b64e(JSON.stringify(exportObj(), null, 1)) }; if (SY.sha) body.sha = SY.sha;
      const r = await syApi('PUT', body);
      if (r.ok) { SY.sha = (await r.json()).content.sha; SY.last = Date.now(); SY.err = ''; try { localStorage.setItem('vtsync:last', String(SY.last)); } catch (e) {} break; }
      if (r.status === 409 || r.status === 422) { SY.sha = null; continue; }
      throw new Error(r.status === 401 ? 'token sai hoặc hết hạn' : r.status === 403 || r.status === 404 ? 'token không có quyền ghi repo' : 'HTTP ' + r.status);
    }
  } catch (e) { SY.err = String(e.message || e); console.warn('sync push', e); }
  SY.busy = false; syUpd(); if (SY.again) { SY.again = false; syncSoon(); }
}
async function syncPull(verbose) {
  if (!syTok()) return false;
  try {
    const r = await syApi('GET');
    if (r.status === 404) { SY.sha = null; if (verbose) ioMsg('Repo chưa có file — sẽ tạo mới.'); return true; }
    if (!r.ok) throw new Error(r.status === 401 ? 'token sai hoặc hết hạn' : 'HTTP ' + r.status);
    const j = await r.json(); SY.sha = j.sha; const o = JSON.parse(b64d(j.content));
    SY.applying = true; let n = 0;
    Object.keys(o.days || {}).forEach(k => { const v = o.days[k], c = state.days[k]; if (v && isKey(k) && (!c || (v.u || 0) > (c.u || 0))) { state.days[k] = v; if (S.mode === 'local') lsSet('day:' + k, v); n++; } });
    if (Array.isArray(o.inbody)) { const have = new Set(state.inbody.map(x => x.id)); const add = o.inbody.filter(x => x && x.id && !have.has(x.id)); if (add.length) { state.inbody = state.inbody.concat(add).sort((a, b) => a.date < b.date ? -1 : 1); if (S.mode === 'local') lsSet('inbody', { list: state.inbody }); n++; } }
    if (Array.isArray(o.presets)) { const have = new Set(state.presets.map(x => x.n)); const add = o.presets.filter(x => x && x.n && !have.has(x.n)); if (add.length) { state.presets = state.presets.concat(add); if (S.mode === 'local') lsSet('presets', { list: state.presets }); } }
    n += mergeHabits(o);
    SY.applying = false; keysCache = null; SY.err = ''; SY.last = Date.now();
    if (n) { render(); toast('Đã lấy ' + n + ' mục mới từ bản đồng bộ.'); }
    if (verbose) ioMsg('Đã kết nối. Lấy về ' + n + ' mục mới.');
    syUpd(); return true;
  } catch (e) { SY.applying = false; SY.err = String(e.message || e); if (verbose) ioMsg('Lỗi đồng bộ: ' + SY.err); syUpd(); return false; }
}

/* ---------- boot ---------- */
async function boot() {
  wire(); applyTheme(); renderHeader(); setStatus();
  await initStore();
  ui.ready = true;
  if (!state.settings.phaseStart) { state.settings.phaseStart = mondayOf(todayKey()); queue('settings'); }
  applyTheme(); render();
  if (syTok()) syncPull(false).then(ok => { if (ok) syncSoon(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && syTok() && SY.t) { clearTimeout(SY.t); syncPush(); } });
}
boot();
})();
